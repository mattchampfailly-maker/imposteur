<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jeu de l'Imposteur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Chargements des bases de données externes -->
  <script src="paires.js"></script>
  <script src="questions.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gradient-text { background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-btn { background: linear-gradient(135deg, #9333ea 0%, #c026d3 100%); }
    .gradient-btn:active { transform: scale(0.98); }
    .pulse-glow { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between select-none overflow-x-hidden">
  <header class="w-full max-w-md mx-auto p-4 flex items-center justify-between z-10">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl gradient-btn flex items-center justify-center font-black text-xl shadow-lg">🕵️</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight leading-none">IMPOSTEUR</h1>
        <span class="text-xs text-purple-400 font-medium">Pass & Play</span>
      </div>
    </div>
    <div class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">Classique</div>
  </header>

  <main class="w-full max-w-md mx-auto px-4 flex-1 flex flex-col justify-center pb-6">
    <!-- SCREEN 1: SETUP -->
    <section id="screen-setup" class="space-y-5">
      <div class="glass-panel p-5 rounded-3xl space-y-4">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 font-bold">1. Les Joueurs</h2>
        <div class="flex gap-2">
          <input type="text" id="player-input" placeholder="Prénom..." class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white focus:border-purple-500 outline-none">
          <button id="btn-add-player" class="bg-slate-800 text-purple-300 font-semibold px-4 py-3 rounded-2xl border border-slate-700 active:scale-95 text-sm">+ Ajouter</button>
        </div>
        <div class="flex justify-between text-xs text-slate-400">
          <span>Raccourcis rapide :</span>
          <button id="btn-preset-default" class="text-purple-400 hover:underline">Charger l'équipe</button>
        </div>
        <div id="player-list" class="flex flex-wrap gap-2 pt-2 min-h-[48px]"></div>
      </div>

      <div class="glass-panel p-5 rounded-3xl space-y-4">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 font-bold">2. Paramètres</h2>
        <div class="space-y-3">
          <label class="text-xs text-slate-400 block mb-1">Mode de jeu :</label>
          <select id="mode-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none">
            <option value="1">Mode 1 (Mots : Base paires.js)</option>
            <option value="2">Mode 2 (Questions : Base questions.js)</option>
          </select>
        </div>
      </div>
      <button id="btn-start" onclick="startGame()" disabled class="w-full gradient-btn opacity-50 cursor-not-allowed text-white font-extrabold py-4 rounded-2xl shadow-xl flex justify-center gap-2">
        <span>LANCER LA PARTIE</span><span>🚀</span>
      </button>
    </section>

    <!-- SCREEN 2: PASS DEVICE -->
    <section id="screen-pass" class="hidden text-center space-y-6">
      <div class="glass-panel p-8 rounded-3xl space-y-6 flex flex-col items-center">
        <div class="w-20 h-20 rounded-full bg-slate-800 flex justify-center items-center text-4xl shadow-inner animate-pulse">🔒</div>
        <div>
          <span class="text-xs font-bold text-purple-400 uppercase">Attention anti-triche</span>
          <h2 class="text-2xl font-black mt-1">Passez l'appareil à</h2>
          <div id="pass-player-name" class="text-3xl font-black gradient-text mt-2"></div>
        </div>
        <button onclick="revealSecret()" class="w-full bg-slate-800 text-purple-300 font-bold py-4 rounded-2xl active:scale-95 text-sm flex justify-center gap-2">
          <span>👀</span><span>Je suis <span id="pass-player-btn-name"></span> - Révéler</span>
        </button>
      </div>
    </section>

    <!-- SCREEN 3: REVEAL -->
    <section id="screen-reveal" class="hidden text-center space-y-5">
      <div class="glass-panel p-6 rounded-3xl space-y-5 border-purple-500/40 pulse-glow">
        <div class="flex justify-between text-xs font-bold text-slate-400 border-b border-slate-800 pb-3">
          <span>JOUEUR : <span id="reveal-player-name" class="text-purple-400 uppercase"></span></span>
          <span class="text-slate-500">MOT SECRET</span>
        </div>
        <div class="py-4 space-y-2">
          <span class="text-xs text-slate-400 uppercase block font-medium">Votre consigne secrète :</span>
          <div id="secret-content" class="text-xl font-black text-white px-2 py-3 bg-slate-900/90 rounded-2xl border border-purple-500/30 break-words"></div>
        </div>
        <div class="space-y-2 text-left">
          <label class="text-xs text-slate-400 block">Votre réponse :</label>
          <input type="text" id="player-response" placeholder="Optionnel..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none">
        </div>
        <button onclick="nextTurn()" class="w-full gradient-btn text-white font-extrabold py-4 rounded-2xl text-sm flex justify-center gap-2">
          <span>Masquer & Suivant</span><span>🔒</span>
        </button>
      </div>
    </section>

    <!-- SCREEN 4: RECAP -->
    <section id="screen-recap" class="hidden space-y-5">
      <div class="glass-panel p-6 rounded-3xl space-y-5">
        <div class="text-center">
          <span class="text-xs font-bold text-purple-400 uppercase">Fin du tour</span>
          <h2 class="text-2xl font-black">Récapitulatif</h2>
        </div>
        <div id="recap-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        <div class="glass-card p-4 rounded-2xl flex justify-between items-center">
          <div class="flex items-center gap-3">
            <span class="text-2xl">⏳</span>
            <div>
              <div class="text-xs text-slate-400 font-semibold">Débat</div>
              <div id="timer-display" class="text-lg font-black text-white">03:00</div>
            </div>
          </div>
          <button id="btn-timer" onclick="toggleTimer()" class="bg-slate-800 text-slate-200 text-xs font-bold px-4 py-2 rounded-xl">Démarrer</button>
        </div>
        <button onclick="goToVote()" class="w-full gradient-btn text-white font-extrabold py-4 rounded-2xl text-sm">Passer au Vote 🗳️</button>
      </div>
    </section>

    <!-- SCREEN 5: VOTE -->
    <section id="screen-vote" class="hidden space-y-5">
      <div class="glass-panel p-6 rounded-3xl space-y-5 text-center">
        <div>
          <h2 class="text-2xl font-black">Qui est l'Imposteur ?</h2>
        </div>
        <div id="vote-box">
          <button onclick="revealImpostor()" class="w-full py-6 rounded-2xl bg-gradient-to-r from-red-600 via-purple-600 to-pink-600 text-white font-black text-lg animate-bounce">🔥 RÉVÉLER 🔥</button>
        </div>
        <div id="result-card" class="hidden space-y-5 pt-2">
          <div class="p-5 rounded-2xl bg-slate-900 border border-purple-500/50 space-y-3">
            <div id="impostor-name" class="text-3xl font-black text-rose-400"></div>
            <div class="pt-3 border-t border-slate-800 text-left text-xs space-y-2">
              <div class="flex justify-between bg-slate-950 p-3 rounded-xl"><span id="lbl-civ" class="text-slate-400">Civils:</span><span id="res-civ" class="font-bold text-emerald-400 text-right ml-2 break-words"></span></div>
              <div class="flex justify-between bg-slate-950 p-3 rounded-xl"><span id="lbl-imp" class="text-slate-400">Imposteur:</span><span id="res-imp" class="font-bold text-rose-400 text-right ml-2 break-words"></span></div>
            </div>
          </div>
          <button onclick="location.reload()" class="w-full gradient-btn text-white font-extrabold py-4 rounded-2xl text-sm">Nouvelle Manche 🔄</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let players = [], impIdx = -1, currTurn = 0, pair = {}, mode = "1", ans = {}, timer = null, time = 180;

    document.getElementById("player-input").addEventListener("keypress", e => { if (e.key === "Enter") addPlayer(); });
    document.getElementById("btn-add-player").addEventListener("click", addPlayer);
    document.getElementById("btn-preset-default").addEventListener("click", () => { players = ["Alicia", "Matt", "Clément", "Adrian", "Liana"]; render(); });

    function addPlayer() {
      const v = document.getElementById("player-input").value.trim();
      if (v && !players.includes(v)) { players.push(v); document.getElementById("player-input").value = ""; render(); }
    }
    function remove(i) { players.splice(i, 1); render(); }
    function render() {
      const c = document.getElementById("player-list"); c.innerHTML = "";
      players.forEach((p, i) => {
        c.innerHTML += `<div class="flex items-center gap-1.5 bg-slate-900 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold"><span>${p}</span><button onclick="remove(${i})" class="text-rose-400 ml-1">✕</button></div>`;
      });
      document.getElementById("btn-start").disabled = players.length < 3;
      document.getElementById("btn-start").className = players.length < 3 ? "w-full gradient-btn opacity-50 cursor-not-allowed text-white font-extrabold py-4 rounded-2xl shadow-xl flex justify-center gap-2" : "w-full gradient-btn text-white font-extrabold py-4 rounded-2xl shadow-xl flex justify-center gap-2";
    }

    function startGame() {
      if (players.length < 3) return;
      mode = document.getElementById("mode-select").value;
      impIdx = Math.floor(Math.random() * players.length);
      currTurn = 0; ans = {};
      
      let p;
      if (mode === "1") {
        if (typeof paires === 'undefined') { alert("paires.js manquant"); return; }
        p = paires[Math.floor(Math.random() * paires.length)];
      } else {
        if (typeof questions === 'undefined') { alert("questions.js manquant"); return; }
        p = questions[Math.floor(Math.random() * questions.length)];
      }
      
      const inv = Math.random() < 0.5;
      pair = { civ: inv ? p[1] : p[0], imp: inv ? p[0] : p[1] };
      show("screen-pass"); initPass();
    }

    function initPass() {
      document.getElementById("pass-player-name").innerText = players[currTurn];
      document.getElementById("pass-player-btn-name").innerText = players[currTurn];
    }

    function revealSecret() {
      show("screen-reveal");
      document.getElementById("reveal-player-name").innerText = players[currTurn];
      document.getElementById("secret-content").innerText = currTurn === impIdx ? pair.imp : pair.civ;
      document.getElementById("player-response").value = "";
    }

    function nextTurn() {
      ans[players[currTurn]] = document.getElementById("player-response").value.trim() || "—";
      currTurn++;
      if (currTurn < players.length) { show("screen-pass"); initPass(); } else { buildRecap(); show("screen-recap"); }
    }

    function buildRecap() {
      document.getElementById("recap-list").innerHTML = players.map(p => `<div class="glass-card p-3 rounded-xl flex justify-between text-xs"><span class="font-bold text-purple-300">${p}</span><span class="text-slate-300 bg-slate-900/80 px-3 py-1 rounded-lg">${ans[p]}</span></div>`).join("");
      clearInterval(timer); time = 180; updTime(); document.getElementById("btn-timer").innerText = "Démarrer";
    }

    function goToVote() { show("screen-vote"); }

    function revealImpostor() {
      document.getElementById("vote-box").classList.add("hidden");
      document.getElementById("result-card").classList.remove("hidden");
      document.getElementById("impostor-name").innerText = players[impIdx];
      document.getElementById("lbl-civ").innerText = mode === "1" ? "Mot (Civils)" : "Question (Civils)";
      document.getElementById("lbl-imp").innerText = mode === "1" ? "Indice (Imposteur)" : "Question (Imposteur)";
      document.getElementById("res-civ").innerText = pair.civ;
      document.getElementById("res-imp").innerText = pair.imp;
      if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }

    function show(id) {
      ["screen-setup", "screen-pass", "screen-reveal", "screen-recap", "screen-vote"].forEach(s => document.getElementById(s).classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    function toggleTimer() {
      const b = document.getElementById("btn-timer");
      if (timer) { clearInterval(timer); timer = null; b.innerText = "Reprendre"; }
      else { b.innerText = "Pause"; timer = setInterval(() => { if (time > 0) { time--; updTime(); } else { clearInterval(timer); b.innerText = "Terminé"; } }, 1000); }
    }
    function updTime() { document.getElementById("timer-display").innerText = `${Math.floor(time/60).toString().padStart(2,'0')}:${(time%60).toString().padStart(2,'0')}`; }
  </script>
</body>
</html>
